name: Mirror to thedecisionstack/tools

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    # ⚠ ONLY RUN IN THE SOURCE REPO.
    #
    # The push below is `--all --force`, so it copies every ref — including THIS FILE. The mirror
    # therefore receives the workflow and runs it too, where there is no MIRROR_PAT: the remote URL
    # gets an empty token and the push dies with exit 128. Every run in thedecisionstack/tools had
    # failed that way since the mirror was set up, emailing a "Run failed" alert on each push, which
    # read as "the mirror is broken" when the mirror had in fact never failed once.
    #
    # A file cannot be excluded from a `--all` push, so guarding the job is the fix. The mirrored
    # copy now skips instead of failing.
    if: github.repository == 'lunastak/tools'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (full history, all branches)
        # v5: v4 targets Node 20, deprecated and already force-run on Node 24.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to thedecisionstack/tools
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add mirror "https://x-access-token:${MIRROR_PAT}@github.com/thedecisionstack/tools.git"
          git push mirror --all --force
          git push mirror --tags --force
